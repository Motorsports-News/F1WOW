<!DOCTYPE html>
<html>
<head>
    <meta name="robots" content="noindex, nofollow">
    <title>Test Schedule Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: white; }
        .race-card { background: #16213e; padding: 15px; margin: 10px 0; border-left: 4px solid #e74c3c; border-radius: 5px; }
        .completed { border-left-color: #27ae60; }
        .winner { color: #27ae60; font-weight: bold; }
        .debug { background: #0f3460; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8228873195232669" crossorigin="anonymous"></script>
</head>
<body>
    <h1>Race Schedule Debug Test</h1>
    <div id="debug-info" class="debug"></div>
    <div id="schedule"></div>

    <script src="script.js"></script>
    <script>
        // Hardcoded schedule data
        const hardcodedSchedule = RACE_SCHEDULE_2026;

        // Find Spanish GP Barcelona
        const barcelonaGP = hardcodedSchedule.find(race =>
            race.name === 'Spain' && race.location === 'Barcelona'
        );

        // Find British GP
        const britishGP = hardcodedSchedule.find(race =>
            race.name === 'Great Britain'
        );

        const debugInfo = `
            <h3>🔍 Debug Information:</h3>
            <p><strong>Spanish GP (Barcelona):</strong> Round ${barcelonaGP.round}, Completed: ${barcelonaGP.completed}, Winner: ${barcelonaGP.winner || 'None'}</p>
            <p><strong>British GP:</strong> Round ${britishGP.round}, Completed: ${britishGP.completed}, Winner: ${britishGP.winner || 'None'}</p>
            <p><strong>Data Source:</strong> Hardcoded RACE_SCHEDULE_2026 array</p>
        `;

        document.getElementById('debug-info').innerHTML = debugInfo;

        // Display schedule
        const scheduleHTML = hardcodedSchedule.slice(0, 12).map(race => {
            let statusClass = race.completed ? 'completed' : '';
            let winnerText = race.winner ? `<span class="winner">Winner: ${race.winner}</span>` : 'Not completed';

            return `
                <div class="race-card ${statusClass}">
                    <strong>R${race.round}: ${race.name} GP (${race.location})</strong><br>
                    Date: ${race.date}<br>
                    Status: ${winnerText}
                </div>
            `;
        }).join('');

        document.getElementById('schedule').innerHTML = scheduleHTML;
    </script>
</body>
</html>
