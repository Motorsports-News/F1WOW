    <style>

        }
        .message.error {
            background: rgba(239, 68, 68, 0.2);

            display: block;

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="subscribe-container" id="main">
        <div class="subscribe-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
            </svg>
        </div>
        <h1>Subscribe to F1wow News</h1>
        <p>Get the latest F1 news, race results, and analysis delivered to your inbox. No spam, unsubscribe anytime.</p>

        <form id="subscribeForm" aria-labelledby="subscribeFormTitle">
            <div class="form-group">
                <label for="email" class="visually-hidden">Email address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required aria-required="true" aria-describedby="emailHint">
                <span id="emailHint" class="sr-only">We'll send you F1 news and updates</span>
            </div>
            <button type="submit" id="submitBtn" aria-label="Subscribe to F1 news updates">
                <span id="btnText">Subscribe Now</span>
            </button>
        </form>

        <div id="message" class="message" role="alert" aria-live="polite"></div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        document.getElementById('subscribeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            submitBtn.disabled = true;
            btnText.textContent = 'Subscribing...';

            try {
                const res = await fetch('https://formspree.io/f/mzdwqjwq', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (res.ok) {
                    showMessage('Success! You\'ve been subscribed to F1wow News.', 'success');
                    btnText.textContent = 'Subscribed!';
                    submitBtn.style.background = '#22c55e';
                    document.getElementById('email').value = '';
                } else {
                    throw new Error('Submission failed');
                }
            } catch (error) {
                showMessage('Something went wrong. Please try again.', 'error');
                submitBtn.disabled = false;
                btnText.textContent = 'Subscribe Now';
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message show ' + type;
        }
    </script>
</body>
